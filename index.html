<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbitra</title>
<meta name="description" content="Calculadora de surebet, histórico de apostas, gestão de banca e mapa de casas clones.">
<meta name="theme-color" content="#0E7A5C">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}

:root{
  --bg:#EEF1EE;--surface:#FFFFFF;--surface2:#F5F7F4;--ink:#13201B;--muted:#5D6E66;--line:#D9E0DB;
  --accent:#0E7A5C;--accent-ink:#FFFFFF;--accent-soft:#DDF1E9;
  --good:#0E7A5C;--good-soft:#DDF1E9;--bad:#C2413A;--bad-soft:#F8E1DF;--warn:#A86A12;--warn-soft:#F7EBD6;--info:#2F6FB0;--info-soft:#DFEAF6;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 8px 28px rgba(19,32,27,.10);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0B1210;--surface:#111B18;--surface2:#16221E;--ink:#E6EEEA;--muted:#8FA39A;--line:#22312C;
  --accent:#3CCB98;--accent-ink:#05231A;--accent-soft:#133A2E;
  --good:#3CCB98;--good-soft:#133A2E;--bad:#F06B62;--bad-soft:#3A1C1A;--warn:#E3A94B;--warn-soft:#3A2C15;--info:#6FA8E6;--info-soft:#172B40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0B1210;--surface:#111B18;--surface2:#16221E;--ink:#E6EEEA;--muted:#8FA39A;--line:#22312C;
  --accent:#3CCB98;--accent-ink:#05231A;--accent-soft:#133A2E;
  --good:#3CCB98;--good-soft:#133A2E;--bad:#F06B62;--bad-soft:#3A1C1A;--warn:#E3A94B;--warn-soft:#3A2C15;--info:#6FA8E6;--info-soft:#172B40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600;font-family:var(--body)}
p{margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="true"] svg{color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;font-size:11px;font-family:var(--mono);background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:12px}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good)}
/* main */
main{padding-block:18px 60px;padding-inline:clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;justify-content:flex-end;gap:8px;align-items:center;position:relative}
.sbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;color:var(--muted);cursor:pointer;min-width:220px}
.sbtn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.ibtn:hover,.sbtn:hover{color:var(--ink);border-color:var(--muted)}
.ibtn .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--mono);display:grid;place-items:center;padding:0 3px}
.pop{position:absolute;top:46px;right:0;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{margin-top:4px;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:12px}
.pos{color:var(--good)}.neg{color:var(--bad)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.neu{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}
/* banner & alerts */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--info-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--warn-soft);font-size:14px}
.alert svg{flex:none;color:var(--warn);margin-top:2px}
.alert.bad{background:var(--bad-soft)}.alert.bad svg{color:var(--bad)}
.alert.good{background:var(--good-soft)}.alert.good svg{color:var(--good)}
/* calc */
.legs{display:flex;flex-direction:column;gap:10px}
.leg{display:grid;grid-template-columns:22px minmax(110px,1.4fr) minmax(70px,.8fr) minmax(56px,.5fr) auto;gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.leg .n{font-family:var(--mono);font-weight:700;color:var(--muted);align-self:center}
.leg .opts{display:flex;flex-direction:column;gap:4px;padding-bottom:4px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
.result{display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.pbar span{display:block;height:100%;background:var(--accent)}
.out{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 14px;font-size:14px;align-items:baseline}
.out .h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
/* clones */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-items:start}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prov.hot{border-color:var(--bad)}
.prov-h{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.prov-h .sub{font-size:12px;color:var(--muted)}
.hl{list-style:none;margin:0;padding:0}
.hl li{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.hl li:last-child{border-bottom:0}
.hl .nm{font-weight:600}
.hl .meta{font-size:12px;color:var(--muted);grid-column:1/-1}
.hl select{width:auto;padding:2px 6px;font-size:12px}
.chain{margin:0;padding:10px 16px;background:var(--bad-soft);font-size:13px}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{font-weight:500}
.li .s{font-size:12px;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:10px;text-align:center;color:var(--muted);font-weight:600;letter-spacing:.06em;padding-bottom:4px}
.cal button{min-width:0;padding:0;aspect-ratio:1;border:1px solid transparent;background:var(--surface2);border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:13px;position:relative;max-width:100%}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal button .d{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal button[aria-pressed="true"] .d{background:var(--accent-ink)}
.note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.note p{white-space:pre-wrap;font-size:14px}
/* guides */
details.guide{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.guide>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
details.guide[open]>summary::after{content:"−"}
details.guide .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;max-width:72ch;font-size:14px}
details.guide ol,details.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
code{font-family:var(--mono);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px}
details.panel>summary{cursor:pointer;list-style:none;font-weight:600}
details.panel>summary::-webkit-details-marker{display:none}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px;align-items:end}
/* palette */
.overlay{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palette{width:min(540px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px;background:var(--surface)}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li button{width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.palette li button:hover,.palette li button.sel{background:var(--accent-soft)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:500;z-index:70;box-shadow:var(--shadow)}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-block:14px 96px}
  .sbtn{min-width:0;flex:1}
  .sbtn kbd{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;overflow-x:auto;gap:2px}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:4px 8px;cursor:pointer;flex:1 0 64px}
  .bnav button[aria-current="true"]{color:var(--accent)}
  .bnav svg{width:20px;height:20px}
  .leg{grid-template-columns:22px 1fr 1fr}
  .leg .house{grid-column:2/-1}
  .leg .odd{grid-column:2}
  .leg .comm{grid-column:3}
  .leg .opts{flex-direction:row;gap:14px;grid-column:2/-1}
  h1{font-size:24px}
  .big{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* auth */
#auth{min-height:100%;background:var(--bg);padding-inline:16px;padding-block:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.auth-wrap{width:min(1040px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.auth-pitch{display:flex;flex-direction:column;gap:22px}
.auth-pitch .brand{padding:0}
.auth-h{font-size:clamp(34px,5vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.03em;max-width:12ch}
.auth-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.auth-feats li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.auth-feats svg{color:var(--accent);flex:none;margin-top:2px}
.auth-sample{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-width:340px}
.auth-card{padding:28px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-foot{font-size:12px;text-align:center}
#auth a{color:var(--accent)}
@media (max-width:860px){.auth-wrap{grid-template-columns:1fr;gap:28px}.auth-sample{display:none}.auth-card{padding:22px}}

</style>
</head>

async function flush(){
  if(cloud.demo){try{localStorage.setItem(LS+'.demo',JSON.stringify({core:U.core,bets:U.bets,cat:CAT}))}catch(e){}return}
  if(!cloud.on||!fb)return;

  saving=true;const uid=cloud.uid;
  try{
    const cj=JSON.stringify(U.core);
    if(cj!==written.core){await setDoc(doc(fb.db,'users',uid),{...JSON.parse(cj),profile:{email:cloud.user.email||'',name:cloud.user.displayName||''},updatedAt:serverTimestamp()});written.core=cj}
    const months={};U.bets.forEach(b=>{const k=b.date.slice(0,7);(months[k]=months[k]||[]).push(b)});
    const keys=new Set([...Object.keys(months),...Object.keys(written.months)]);
    for(const k of keys){
      const j=JSON.stringify({bets:months[k]||[]});
      if(j===written.months[k])continue;
      const ref=doc(fb.db,'users',uid,'months',k);
      if(months[k])await setDoc(ref,JSON.parse(j));else await deleteDoc(ref);
      if(months[k])written.months[k]=j;else delete written.months[k];
    }
    if(cloud.isAdmin&&!CAT.example){const j=JSON.stringify(CAT);if(j!==written.cat){await setDoc(doc(fb.db,'catalog','main'),JSON.parse(j));written.cat=j}}
    setSync('on');
  }catch(e){
    if(e&&e.code==='permission-denied')toast('Sem permissão para salvar esse dado. Confira as regras do Firestore.');
    setSync('err');clearTimeout(retryT);retryT=setTimeout(flush,8000);
  }
  saving=false;if(saveAgain){saveAgain=false;flush()}
}

function chainAlerts(){
  const out=[];
  CAT.providers.forEach(p=>{
    if(/independente/i.test(p.name))return;
    const hs=CAT.houses.filter(h=>h.provider===p.id);
    const hit=hs.filter(h=>['limitada','cortada'].includes(acct(h.id).status));
    const exposed=hs.filter(h=>acct(h.id).status==='ativa');
    if(hit.length&&exposed.length)out.push({p,hit,exposed});
  });
  return out;
}
const settled=b=>b.status!=='pendente';
function periodStart(p){if(p==='tudo')return '0000';if(p==='mes')return today().slice(0,7)+'-01';if(p==='ano')return today().slice(0,4)+'-01-01';return dAgo(+p-1)}
function stats(){
  const ym=today().slice(0,7);
  const month=U.bets.filter(b=>b.date.startsWith(ym)&&settled(b));
  const lucro=month.reduce((a,b)=>a+b.profit,0);
  const vol=month.reduce((a,b)=>a+b.stake,0);
  const pend=U.bets.filter(b=>b.status==='pendente');
  const emAposta=pend.reduce((a,b)=>a+b.stake,0);
  const saldo=Object.entries(U.core.accounts).reduce((a,[id,x])=>a+(x.status!=='sem'&&x.balance?+x.balance:0),0);
  const bancos=U.core.banks.reduce((a,b)=>a+(+b.balance||0),0);
  const gastosMes=U.core.expenses.filter(e=>e.date.startsWith(ym)).reduce((a,e)=>a+(+e.value||0),0);
  const hoje=U.bets.filter(b=>b.date===today()&&settled(b)).reduce((a,b)=>a+b.profit,0);
  const all=U.bets.filter(b=>settled(b)&&b.type!=='cassino');
  return {lucro,vol,roi:vol?lucro/vol:0,n:month.length,pend:pend.length,emAposta,saldo,bancos,total:saldo+emAposta,patrimonio:saldo+emAposta+bancos,gastosMes,liquido:lucro-gastosMes,hoje,hit:all.length?all.filter(b=>b.profit>0).length/all.length:0};
}
function alerts(){
  const out=[];
  chainAlerts().forEach(a=>out.push({lvl:'bad',html:`<b>${esc(a.hit.map(h=>h.name).join(', '))}</b> limitada(s). ${esc(a.exposed.map(h=>h.name).join(', '))} usa(m) o mesmo <b>${esc(a.p.name)}</b>: risco de limitação em cadeia.`,go:'clones'}));
  const old=U.bets.filter(b=>b.status==='pendente'&&b.date<dAgo(1));
  if(old.length)out.push({lvl:'warn',html:`${old.length} aposta(s) pendente(s) há mais de um dia.`,hf:'pendente'});
  const s=stats();
  if(U.core.goals.monthly>0&&s.lucro>=U.core.goals.monthly)out.push({lvl:'good',html:`Meta mensal batida: ${sgn(s.lucro)} de ${money(U.core.goals.monthly)}.`,go:'fin',tab:'metas'});
  else if(U.core.goals.daily>0&&s.hoje>=U.core.goals.daily)out.push({lvl:'good',html:`Meta do dia batida: ${sgn(s.hoje)}.`,go:'fin',tab:'metas'});
  return out;
}
/* P/L por casa, atribuído perna a perna */
function houseLedger(bets){
  const m={};const add=(h,st,pl)=>{const x=m[h]=m[h]||{n:0,stake:0,pl:0};x.n++;x.stake+=st;x.pl+=pl};
  bets.filter(settled).forEach(b=>{
    if(b.type==='surebet'){b.legs.forEach((l,i)=>{const cost=l.fb?0:l.stake;let pl=0;if(b.status==='green'){pl=i===b.winLeg?(l.fb?l.stake*(l.odd-1):l.stake*l.odd)-cost:-cost}add(l.house,cost,pl)})}
    else add(b.legs[0].house,b.stake,b.profit);
  });
  return m;
}

/* ================= gráficos ================= */
function nice(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function bars(data,{h=200,line=null,labelEvery=1,aria=''}={}){
  const W=640,pl=52,pr=10,pt=12,pb=26,iw=W-pl-pr,ih=h-pt-pb;
  const mx=nice(Math.max(1,...data.map(x=>x.v))),mn=Math.min(0,...data.map(x=>x.v));
  const lo=mn<0?-nice(-mn):0,hi=mx;
  const y=v=>pt+ih*(1-(v-lo)/(hi-lo));
  const bw=iw/data.length;
  const ticks=lo<0?[lo,0,hi/2,hi]:[0,hi/4,hi/2,hi*3/4,hi];
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(aria)}">`;
  ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t===0?'':'stroke-dasharray="3 4"'}/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${hidden()?'•':Math.round(t).toLocaleString('pt-BR')}</text>`});
  data.forEach((x,i)=>{if(x.v){const y0=y(0),y1=y(x.v);s+=`<rect x="${(pl+i*bw+bw*0.18).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" rx="2" fill="${x.v>0?'var(--good)':'var(--bad)'}" opacity=".85"><title>${esc(x.label)}: ${sgn(x.v)}</title></rect>`}
    if(i%labelEvery===0||i===data.length-1)s+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(x.label)}</text>`});
  if(line){const cMax=Math.max(1,...line),cMin=Math.min(0,...line);const yc=v=>pt+ih*(1-(v-cMin)/(cMax-cMin||1));
    s+=`<polyline points="${line.map((v,i)=>`${(pl+i*bw+bw/2).toFixed(1)},${yc(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--info)" stroke-width="2" stroke-linejoin="round"/><circle cx="${(pl+(line.length-1)*bw+bw/2).toFixed(1)}" cy="${yc(line[line.length-1]).toFixed(1)}" r="4" fill="var(--info)"/>`}
  return s+'</svg>';
}
function dailySeries(days){const out=[];for(let i=days-1;i>=0;i--){const d=dAgo(i);out.push({label:fmtD(d),v:U.bets.filter(b=>b.date===d&&settled(b)).reduce((a,b)=>a+b.profit,0)})}return out}

/* ================= CALCULADORA ================= */
function calc(){
  const legs=C.legs.map(l=>{const o=num(l.odd),c=num(l.comm)||0;const e=1+(o-1)*(1-c/100);return {...l,o,e,ok:o>1}});
  if(legs.some(l=>!l.ok))return {err:'Preencha todas as odds (maiores que 1,00).'};
  const k=legs.map(l=>l.fb?1/(l.e-1):1/l.e);
  const w=legs.map((l,i)=>l.fb?0:k[i]);
  let R;
  if(C.fixed>=0){const fs=num(C.fixedStake);if(!(fs>0))return {err:'Informe o valor da perna fixada.'};R=fs/k[C.fixed]}
  else{const T=num(C.total),sw=w.reduce((a,b)=>a+b,0);if(!(T>0))return {err:'Informe o investimento total.'};if(!sw)return {err:'Com todas as pernas em freebet, fixe o valor de uma delas.'};R=T/sw}
  const step=num(C.round)||0;
  const st=k.map((x,i)=>{if(i===C.fixed)return num(C.fixedStake);let v=R*x;return step>0?Math.round(v/step)*step:Math.round(v*100)/100});
  const cost=st.reduce((a,v,i)=>a+(legs[i].fb?0:v),0);
  const ret=st.map((v,i)=>legs[i].fb?v*(legs[i].e-1):v*legs[i].e);
  const prof=ret.map(r=>r-cost);
  const min=Math.min(...prof);
  const margin=legs.reduce((a,l)=>a+1/l.e,0);
  const provs={};legs.forEach((l,i)=>{const h=H(l.house);const p=h&&P(h.provider);if(p&&!/independente/i.test(p.name))(provs[p.id]=provs[p.id]||[]).push(i+1)});
  const clash=Object.entries(provs).filter(([,a])=>a.length>1).map(([p,a])=>({p:P(p).name,legs:a}));
  const lim=legs.map((l,i)=>({i:i+1,h:H(l.house),st:acct(l.house).status})).filter(x=>x.h&&(x.st==='limitada'||x.st==='cortada'));
  return {legs,st,cost,ret,prof,min,roi:cost?min/cost:0,margin,clash,lim};
}

  const r=calc();
  if(r.err){el.innerHTML=`<h2>Resultado</h2><p class="muted">${r.err}</p>`;return}

  el.innerHTML=`<div class="card-h" style="margin:0"><h2>Resultado</h2><span class="chip ${good?'good':'bad'}"><i></i>${good?'Surebet':'Sem arbitragem'}</span></div>

  </div>

/* ================= HISTÓRICO ================= */

}

/* ================= ANÁLISES ================= */
function vAnalises(){
  const ps=periodStart(ui.anPeriod);
  const bs=U.bets.filter(b=>b.date>=ps&&settled(b));
  const sp=bs.filter(b=>b.type!=='cassino');
  const lucro=bs.reduce((a,b)=>a+b.profit,0),vol=sp.reduce((a,b)=>a+b.stake,0);
  const greens=sp.filter(b=>b.profit>0).length;
  const best=bs.reduce((m,b)=>b.profit>(m?.profit??-Infinity)?b:m,null),worst=bs.reduce((m,b)=>b.profit<(m?.profit??Infinity)?b:m,null);
  // por mês (12)
  const now=new Date();const months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=iso(d).slice(0,7);months.push({label:MONTHS[d.getMonth()],v:U.bets.filter(b=>b.date.startsWith(k)&&settled(b)).reduce((a,b)=>a+b.profit,0)})}
  // dia da semana
  const wd=['dom','seg','ter','qua','qui','sex','sáb'].map(l=>({label:l,v:0,n:0}));
  bs.forEach(b=>{const d=new Date(b.date+'T12:00:00').getDay();wd[d].v+=b.profit;wd[d].n++});
  // por tipo
  const types=['surebet','normal','cassino'].map(t=>{const x=bs.filter(b=>b.type===t);const st=x.reduce((a,b)=>a+b.stake,0),pl=x.reduce((a,b)=>a+b.profit,0);return {t,n:x.length,st,pl,roi:st?pl/st:null}});
  // por casa
  const led=houseLedger(U.bets.filter(b=>b.date>=ps));
  const hrows=Object.entries(led).map(([id,x])=>({id,...x})).sort((a,b)=>b.pl-a.pl);
  return `<div class="head"><div><h1>Análises</h1><p>Desempenho por período, dia da semana, tipo de aposta e casa.</p></div>
    <div class="seg">${[['30','30 dias'],['90','90 dias'],['ano','Este ano'],['tudo','Tudo']].map(([k,l])=>`<button data-an="${k}" aria-pressed="${ui.anPeriod===k}">${l}</button>`).join('')}</div></div>
  <div class="kpis">
    <div class="kpi"><span class="lbl">Lucro</span><span class="v ${lucro>=0?'pos':'neg'}">${sgn(lucro)}</span><small>${bs.length} registros resolvidos</small></div>
    <div class="kpi"><span class="lbl">ROI</span><span class="v">${vol?pct(lucro/vol):'—'}</span><small>sobre ${money(vol)} apostados</small></div>
    <div class="kpi"><span class="lbl">Lucro médio</span><span class="v">${bs.length?sgn(lucro/bs.length):'—'}</span><small>por registro</small></div>
    <div class="kpi"><span class="lbl">Taxa de green</span><span class="v">${sp.length?(greens/sp.length*100).toFixed(0)+'%':'—'}</span><small>${greens} de ${sp.length} apostas</small></div>
  </div>
  <div class="grid g2">
    <section class="card chart"><div class="card-h"><h2>Últimos 12 meses</h2></div>${bars(months,{aria:'Lucro por mês'})}</section>
    <section class="card chart"><div class="card-h"><h2>Por dia da semana</h2><span class="muted" style="font-size:13px">no período</span></div>${bars(wd,{aria:'Lucro por dia da semana'})}</section>
  </div>
  <div class="grid g2" style="align-items:start">
    <section class="card"><div class="card-h"><h2>Por tipo</h2></div><div class="tw"><table><thead><tr><th>Tipo</th><th class="r">Qtd.</th><th class="r">Volume</th><th class="r">Lucro</th><th class="r">ROI</th></tr></thead><tbody>
      ${types.map(x=>`<tr><td>${typeName[x.t]}</td><td class="r num">${x.n}</td><td class="r num">${x.t==='cassino'?'—':money(x.st)}</td><td class="r num ${x.pl>=0?'pos':'neg'}">${sgn(x.pl)}</td><td class="r num">${x.roi===null?'—':pct(x.roi)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="list" style="margin-top:12px">
      ${best?`<div class="li"><div><div class="s">Maior green</div><div class="t">${esc(best.event)}</div></div><span class="num pos">${sgn(best.profit)}</span></div>`:''}
      ${worst&&worst.profit<0?`<div class="li"><div><div class="s">Maior red</div><div class="t">${esc(worst.event)}</div></div><span class="num neg">${sgn(worst.profit)}</span></div>`:''}
    </div></section>
    <section class="card"><div class="card-h"><h2>Por casa</h2><span class="muted" style="font-size:13px">surebets atribuídas perna a perna</span></div><div class="tw"><table><thead><tr><th>Casa</th><th class="r">Pernas</th><th class="r">Volume</th><th class="r">Lucro</th></tr></thead><tbody>
      ${hrows.map(x=>`<tr><td>${esc(houseName(x.id))}</td><td class="r num">${x.n}</td><td class="r num">${money(x.stake)}</td><td class="r num ${x.pl>=0?'pos':'neg'}">${sgn(x.pl)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sem dados no período.</td></tr>'}
    </tbody></table></div></section>
  </div>`;
}

    ${U.core.banks.map(b=>`<tr><td><input data-bn="${b.id}" id="bn_${b.id}" value="${esc(b.name)}"></td><td class="r">${hidden()?'<span class="num">•••••</span>':`<input class="num" data-bb="${b.id}" id="bb_${b.id}" inputmode="decimal" value="${b.balance}" style="width:140px;text-align:right">`}</td><td class="r"><button class="btn sm ghost danger" data-rmbank="${b.id}" aria-label="Remover">✕</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhuma conta cadastrada.</td></tr>'}

function vAprender(){
  const G=[
   ['O que é uma surebet','<p>Quando casas diferentes discordam sobre o mesmo evento, pode existir uma combinação de odds em que a soma das probabilidades implícitas (1/odd) fica abaixo de 100%. Apostando em todos os resultados com as stakes certas, o lucro é o mesmo seja qual for o resultado.</p><p>Exemplo: odd 2,10 numa casa e 2,05 na outra para os dois lados de um jogo. 1/2,10 + 1/2,05 = 96,4%, uma margem de 3,6% a seu favor.</p>'],
   ['Usando a calculadora','<ol><li>Escolha a casa e digite a odd de cada perna (de 2 a 4).</li><li>Informe o investimento total ou marque <b>Fixar</b> numa perna para travar o valor dela (útil quando a casa limita a stake).</li><li><b>Freebet</b>: marque quando a perna usa aposta grátis; o cálculo considera que a stake não volta.</li><li><b>Com. %</b>: comissão da exchange sobre o lucro daquela perna.</li><li>Arredonde para R$ 1 ou R$ 5 para não chamar atenção com valores quebrados. O lucro mostrado já considera o arredondamento.</li><li>Registre no histórico e, quando o jogo acabar, marque qual perna venceu.</li></ol>'],
   ['Casas clones e limitação','<p>Várias casas usam a mesma plataforma (o provedor). Elas costumam dividir o feed de odds e, às vezes, o setor de risco. Duas consequências:</p><ul><li>Surebet entre dois clones raramente é real: se as odds diferem, uma delas costuma ser erro e pode ser cancelada.</li><li>Limitou numa casa, as irmãs podem limitar também. Marque o status das suas contas em <b>Casas clones</b> e o Arbitra avisa quando há risco em cadeia.</li></ul>'],
   ['Gestão de banca','<ul><li>Distribua saldo entre as casas conforme o volume que você faz em cada uma. A aba <b>Banca nas casas</b> mostra onde o dinheiro está parado.</li><li>Registre gastos (ferramentas, taxas) para ver o lucro líquido real.</li><li>Metas diárias e mensais ajudam a medir ritmo, não a forçar apostas. Sem surebet boa, não aposte.</li></ul>'],
   ['Preventivo','<p>Casas analisam padrões. Contas que só fazem apostas de valor em mercados secundários, com valores quebrados, logo depois de uma mudança de odd, chamam atenção. Por isso muita gente faz apostas “normais” de vez em quando, arredonda stakes e evita sempre os mesmos mercados. Use o bloco de notas para anotar o que funciona em cada casa.</p>'],
   ['Aposta com responsabilidade','<p>Surebet reduz risco mas não elimina: odds mudam antes da segunda aposta, apostas são canceladas e contas são limitadas. Aposte só o que pode perder e mantenha o controle de tudo registrado aqui.</p>']
  ];
  return `<div class="head"><div><h1>Aprender</h1><p>Guias curtos sobre o método e sobre como usar cada parte do Arbitra.</p></div></div>
  <div style="display:flex;flex-direction:column;gap:10px">${G.map(([t,b],i)=>`<details class="guide" ${i===0?'open':''}><summary>${t}</summary><div class="gb">${b}</div></details>`).join('')}</div>`;
}

/* ================= paleta ================= */
function palItems(){
  const it=[...VIEWS.map(([k,l])=>({l:'Ir para '+l,run:()=>go(k)})),
    {l:'Nova surebet',run:()=>{ui.calcMode='surebet';go('calc')}},
    {l:'Registrar aposta simples',run:()=>{ui.calcMode='normal';go('calc')}},
    {l:'Registrar resultado de cassino',run:()=>{ui.calcMode='cassino';go('calc')}},
    {l:'Ver apostas pendentes',run:()=>{ui.histFilter='pendente';go('hist')}},
    {l:'Nova nota',run:()=>{ui.editNote=null;go('notas')}},
    {l:'Adicionar gasto',run:()=>go('fin','gastos')},
    {l:'Definir metas',run:()=>go('fin','metas')},
    {l:hidden()?'Mostrar valores':'Ocultar valores',run:()=>toggleHide()},
    {l:'Exportar histórico em CSV',run:()=>{go('hist');exportCSV()}},
    ...CAT.houses.map(h=>({l:'Casa: '+h.name,run:()=>{ui.cloneQ=h.name;go('clones')}}))];
  const q=ui.palQ.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return it.filter(x=>!q||x.l.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)).slice(0,10);
}
function renderPal(){
  const L=document.getElementById('layer');
  if(!ui.pal){L.innerHTML='';return}
  const it=palItems();ui.palSel=Math.min(ui.palSel,Math.max(0,it.length-1));
  const had=document.getElementById('palq');
  if(!had)L.innerHTML=`<div class="overlay" data-act="closepal"><div class="palette" role="dialog" aria-label="Buscar ações"><input id="palq" placeholder="O que você quer fazer?" autocomplete="off"><ul id="pall"></ul></div></div>`;
  document.getElementById('pall').innerHTML=it.map((x,i)=>`<li><button data-pal="${i}" class="${i===ui.palSel?'sel':''}">${ic('arrow',14)}${esc(x.l)}</button></li>`).join('')||'<li class="empty">Nada encontrado.</li>';
  if(!had)document.getElementById('palq').focus();
}
function openPal(){ui.pal=true;ui.palQ='';ui.palSel=0;ui.bell=false;renderNav();renderPal()}
function closePal(){ui.pal=false;renderPal()}

/* ================= render ================= */
function render(){
  renderNav();
  const m=document.getElementById('main');
  m.innerHTML={inicio:vInicio,calc:vCalc,hist:vHist,analises:vAnalises,fin:vFin,clones:vClones,notas:vNotas,aprender:vAprender,perfil:vPerfil}[ui.view]();
  if(ui.view==='calc'&&ui.calcMode==='surebet')renderCalcOut();
}
function rerenderKeep(id){const el=document.getElementById(id);const pos=el?el.selectionStart:0;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}

/* ================= ações ================= */
function toggleHide(){U.core.settings.hide=!U.core.settings.hide;persist();render()}
function mutate(fn,msg){if(U.core.sample&&false)return;fn();persist();render();if(msg)toast(msg)}
function offerFile(filename,data,mime){
  try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Arquivo gerado: '+filename)}
  catch(e){copy(data,'Não foi possível baixar; conteúdo copiado')}
}
function exportCSV(){
  const rows=histRows();
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=['data;evento;tipo;casas;odds;stakes;stake_total;lucro;status'].concat(rows.map(b=>[b.date,q(b.event),typeName[b.type],q(b.legs.map(l=>houseName(l.house)).join(' | ')),q(b.legs.map(l=>l.odd).join(' | ')),q(b.legs.map(l=>l.stake).join(' | ')),String(b.stake).replace('.',','),String(b.status==='pendente'?'':b.profit).replace('.',','),b.status].join(';'))).join('\n');
  offerFile('arbitra-historico-'+today()+'.csv','﻿'+csv,'text/csv');
}
function copy(txt,fail){try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado'),()=>toast(fail||'Não foi possível copiar'))}catch(e){toast(fail||'Não foi possível copiar')}}
function parseLegs(text){
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);const legs=[];
  lines.forEach(line=>{const m=line.match(/(\d+[.,]\d+)(?!.*\d+[.,]\d+)/);if(!m)return;const odd=m[1].replace(',','.');
    const name=line.replace(m[0],'').replace(/[@|:;-]/g,' ').trim().toLowerCase();
    const h=CAT.houses.map(h=>({h,s:name.includes(h.name.toLowerCase())?h.name.length:(h.name.toLowerCase().includes(name)&&name.length>2?1:0)})).sort((a,b)=>b.s-a.s)[0];
    legs.push({house:h&&h.s?h.h.id:'',odd,fb:false,comm:'0'})});
  return legs.slice(0,4);
}

document.addEventListener('click',e=>{
  if(ui.bell&&!e.target.closest('.pop,[data-act="bell"]')){ui.bell=false;renderNav()}
  const t=e.target.closest('button,[data-act="closepal"]');if(!t)return;
  if(t.classList.contains('overlay')&&e.target!==t)return;
  const d=t.dataset;
  if(d.pal!==undefined){const it=palItems()[+d.pal];closePal();it&&it.run();return}
  if(d.go){if(d.mode)ui.calcMode=d.mode;go(d.go,d.tab);return}
  if(d.th){setTheme(d.th);return}
  if(d.cm){ui.calcMode=d.cm;render();return}
  if(d.tab){ui.finTab=d.tab;render();return}
  if(d.an){ui.anPeriod=d.an;render();return}
  if(d.hf){ui.histFilter=d.hf;ui.bell=false;if(ui.view!=='hist')go('hist');else render();return}
  if(d.cr){ui.cloneRisk=d.cr;render();return}
  if(d.nm){const [y,m]=ui.noteMonth.split('-').map(Number);ui.noteMonth=iso(new Date(y,m-1+(+d.nm),1)).slice(0,7);render();return}
  if(d.day!==undefined){ui.noteDay=d.day&&ui.noteDay!==d.day?d.day:null;if(d.day)ui.noteMonth=d.day.slice(0,7);render();return}
  if(d.editnote){ui.editNote=d.editnote;render();document.getElementById('nt_title')?.focus();return}
  if(d.rmnote){mutate(()=>{U.core.notes=U.core.notes.filter(n=>n.id!==d.rmnote);if(ui.editNote===d.rmnote)ui.editNote=null},'Nota excluída');return}
  if(d.win){const [id,i]=d.win.split(':');mutate(()=>{const b=U.bets.find(x=>x.id===id);const l=b.legs[+i];b.winLeg=+i;b.status='green';b.profit=+((l.fb?l.stake*(l.odd-1):l.stake*l.odd)-b.stake).toFixed(2)},'Resultado salvo');return}
  if(d.settle){const [id,st]=d.settle.split(':');mutate(()=>{const b=U.bets.find(x=>x.id===id);b.status=st;b.winLeg=null;const l=b.legs[0];b.profit=st==='green'?+(l.stake*(l.odd-1)).toFixed(2):st==='red'?-b.stake:0},st==='pendente'?'Aposta reaberta':'Resultado salvo');return}
  if(d.ask){ui.confirm=d.ask;render();return}
  if(d.del){ui.confirm=null;mutate(()=>{U.bets=U.bets.filter(x=>x.id!==d.del)},'Registro excluído');return}
  if(d.rmh){mutate(()=>{CAT.houses=CAT.houses.filter(h=>h.id!==d.rmh);persistCat()},'Casa removida do catálogo');return}
  if(d.rmbank){mutate(()=>{U.core.banks=U.core.banks.filter(b=>b.id!==d.rmbank)},'Conta removida');return}
  if(d.rmexp){mutate(()=>{U.core.expenses=U.core.expenses.filter(x=>x.id!==d.rmexp)},'Gasto removido');return}
  switch(d.act){
    case 'pal':openPal();break;
    case 'signup':showAuth('signup');break;
    case 'login':showAuth('login');break;
    case 'logout':if(fb){flush().finally(()=>signOut(fb.auth))}break;
    case 'resetpw':if(fb&&cloud.user?.email)sendPasswordResetEmail(fb.auth,cloud.user.email).then(()=>toast('Enviamos um link para '+cloud.user.email),()=>toast('Não foi possível enviar o e-mail agora'));break;
    case 'savename':{const n=document.getElementById('acc_name').value.trim();updateProfile(fb.auth.currentUser,{displayName:n}).then(()=>{written.core=null;persist();toast('Nome salvo')},()=>toast('Não foi possível salvar o nome'));break}
    case 'closepal':closePal();break;
    case 'bell':ui.bell=!ui.bell;renderNav();break;
    case 'hide':toggleHide();break;
    case 'noconfirm':ui.confirm=null;render();break;
    case 'askwipe':ui.confirm='wipeall';render();break;
    case 'askdelacc':ui.confirm='delacc';render();break;
    case 'delacc':ui.confirm=null;deleteAccount();break;
    case 'wipe':ui.confirm=null;mutate(()=>{const th=U.core.settings.theme;U={core:emptyCore(),bets:[]};U.core.settings.theme=th;C=calcDefault()},'Dados apagados. Tudo pronto para começar.');break;
    case 'addleg':C.legs.push({house:'',odd:'',fb:false,comm:'0'});render();break;
    case 'rmleg':C.legs.pop();if(C.fixed>=C.legs.length)C.fixed=-1;render();break;
    case 'resetcalc':C=calcDefault();C.legs.forEach(l=>l.odd='');render();break;
    case 'unfix':C.fixed=-1;render();break;
    case 'importlegs':{const legs=parseLegs(document.getElementById('cimp').value);if(legs.length<2){toast('Encontrei menos de 2 odds. Use uma linha por perna, ex.: Casa Livre 2,05');break}C.legs=legs;C.fixed=-1;render();toast(legs.length+' pernas preenchidas'+(legs.some(l=>!l.house)?'. Confira as casas não reconhecidas':''));break}
    case 'savecalc':{const r=calc();if(r.err){toast(r.err);break}
      mutate(()=>{U.bets.unshift({id:uid(),date:today(),event:C.event.trim()||'Surebet sem nome',type:'surebet',legs:r.legs.map((l,i)=>({house:l.house,odd:l.o,stake:+r.st[i].toFixed(2),fb:!!l.fb})),stake:+r.cost.toFixed(2),exp:+r.min.toFixed(2),profit:0,status:'pendente',winLeg:null});C.event=''},'Surebet registrada como pendente');break}
    case 'copycalc':{const r=calc();if(r.err)break;copy(r.legs.map((l,i)=>`${i+1}) ${houseName(l.house)} @${l.o.toFixed(2)} → ${brl.format(r.st[i])}`).join('\n')+`\nLucro: ${brl.format(r.min)} (${pct(r.roi)})`);break}
    case 'addmine':{const id=document.getElementById('addMine').value;mutate(()=>setAcct(id,{status:'ativa',balance:0}),houseName(id)+' adicionada à banca');break}
    case 'exportj':document.getElementById('cjson').value=JSON.stringify(CAT.houses.map(h=>({nome:h.name,provedor:P(h.provider)?.name||'',risco:h.risk,cartoes:h.cards||null,pagamento:h.pay,notas:h.notes})),null,1);break;
    case 'copyj':copy(document.getElementById('cjson').value);break;
    case 'clearcat':mutate(()=>{CAT={providers:[{id:'p-indep',name:'Independente',notes:'Casas com plataforma própria.'}],houses:[]};persistCat()},'Catálogo esvaziado');break;
    case 'importj':{let arr;try{arr=JSON.parse(document.getElementById('cjson').value)}catch(err){toast('JSON inválido: confira aspas e colchetes');break}
      if(!Array.isArray(arr)){toast('O JSON precisa ser uma lista [ … ]');break}
      let n=0;mutate(()=>{if(CAT.example){CAT={providers:[],houses:[]}}
        arr.forEach(x=>{if(!x||!x.nome)return;const pn=String(x.provedor||'Independente').trim();let p=CAT.providers.find(p=>p.name.toLowerCase()===pn.toLowerCase());if(!p){p={id:'p-'+uid(),name:pn,notes:''};CAT.providers.push(p)}
          const ex=CAT.houses.find(h=>h.name.toLowerCase()===String(x.nome).toLowerCase());const risk=['baixo','medio','alto'].includes(x.risco)?x.risco:'medio';const cards=parseInt(x.cartoes)||null;
          if(ex)Object.assign(ex,{provider:p.id,risk,cards:cards??ex.cards,pay:x.pagamento||ex.pay,notes:x.notas||ex.notes});else CAT.houses.push({id:'h-'+uid(),name:String(x.nome),provider:p.id,risk,cards,pay:x.pagamento||'',notes:x.notas||''});n++});
        persistCat()});toast(n+' casa(s) importada(s)');break}
    case 'cancelnote':ui.editNote=null;render();break;
    case 'csv':exportCSV();break;
    case 'backup':{const j=JSON.stringify({app:'arbitra',v:2,core:U.core,bets:U.bets},null,1);document.getElementById('bkjson').value=j;offerFile('arbitra-backup-'+today()+'.json',j,'application/json');break}
    case 'copybk':copy(document.getElementById('bkjson').value);break;
    case 'restore':{let x;try{x=JSON.parse(document.getElementById('bkjson').value)}catch(err){toast('Backup inválido: o texto não é um JSON');break}
      if(!x||!x.core||!Array.isArray(x.bets)){toast('Backup inválido: faltam os campos core e bets');break}
      mutate(()=>{U.core=Object.assign(emptyCore(),x.core);U.core.sample=false;U.bets=x.bets;sortBets(U.bets)},'Backup restaurado: '+x.bets.length+' registros');break}
  }
});

document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='palq'){ui.palQ=t.value;ui.palSel=0;renderPal();return}
  if(d.leg!==undefined){C.legs[+d.leg][d.k]=t.type==='checkbox'?t.checked:t.value;if(d.k!=='house')renderCalcOut();return}
  if(d.c){C[d.c]=t.value;if(d.c!=='event')renderCalcOut();return}
  if(d.n){N[d.n]=t.value;if(d.n==='odd'||d.n==='stake')rerenderKeep(t.id);return}
  if(d.k2){K[d.k2]=t.value;if(d.k2==='value')rerenderKeep(t.id);return}
  if(t.id==='hq'){ui.histQ=t.value;rerenderKeep('hq');return}
  if(t.id==='cq'){ui.cloneQ=t.value;rerenderKeep('cq');return}
  if(t.id==='nq'){ui.noteQ=t.value;rerenderKeep('nq');return}
  if(d.hb){setAcct(d.hb,{balance:num(t.value)||0});persist();return}
  if(d.bb){const b=U.core.banks.find(x=>x.id===d.bb);b.balance=num(t.value)||0;persist();return}
  if(d.bn){const b=U.core.banks.find(x=>x.id===d.bn);b.name=t.value;persist();return}
  if(d.goal){U.core.goals[d.goal]=num(t.value)||0;persist();return}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.leg!==undefined&&d.k==='house'){C.legs[+d.leg].house=t.value;renderCalcOut();return}
  if(d.fix!==undefined){const r=calc();C.fixed=+d.fix;C.fixedStake=String(r.err?100:Math.round(r.st[C.fixed]));render();return}
  if(d.hs){mutate(()=>setAcct(d.hs,{status:t.value}),houseName(d.hs)+': '+STATUS[t.value][1].toLowerCase());return}
  if(d.hb||d.bb||d.goal){render();return}
  if(d.n==='house'){N.house=t.value;return}
  if(d.k2==='house'){K.house=t.value;return}
  if(t.id==='htype'){ui.histType=t.value;render();return}
  if(t.id==='hper'){ui.histPeriod=t.value;render();return}
  if(t.id==='set_hide'){toggleHide();return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.id;const v=id=>document.getElementById(id).value;
  if(f==='fN'){const o=num(N.odd),s=num(N.stake);if(!(o>1&&s>0)){toast('Confira a odd (maior que 1) e a stake');return}if(!N.house){toast('Escolha a casa');return}
    mutate(()=>{U.bets.push({id:uid(),date:N.date||today(),event:N.event.trim()||'Aposta simples',type:'normal',legs:[{house:N.house,odd:o,stake:s}],stake:s,exp:+(s*(o-1)).toFixed(2),profit:0,status:'pendente'});sortBets(U.bets);N.event=''},'Aposta registrada como pendente')}
  if(f==='fK'){const val=num(K.value);if(!isFinite(val)||val===0){toast('Informe um valor diferente de zero');return}
    mutate(()=>{U.bets.push({id:uid(),date:K.date||today(),event:K.event.trim()||'Cassino',type:'cassino',legs:[{house:K.house,odd:0,stake:0}],stake:0,exp:0,profit:+val.toFixed(2),status:val>0?'green':'red'});sortBets(U.bets);K.value='';K.event=''},'Resultado de cassino registrado')}
  if(f==='fHouse'){let pid=v('hp');const name=v('hn').trim();if(!name)return;
    if(pid==='__new'){const n=v('hpn').trim();if(!n){toast('Dê um nome ao novo provedor');return}}
    mutate(()=>{if(CAT.example){const keep=pid;CAT=clone(CAT);CAT.example=false}
      if(pid==='__new'){pid='p-'+uid();CAT.providers.push({id:pid,name:v('hpn').trim(),notes:''})}
      CAT.houses.push({id:'h-'+uid(),name,provider:pid,risk:v('hr'),cards:parseInt(v('hc'))||null,pay:v('hpay'),notes:v('hno')});persistCat()},'Casa cadastrada')}
  if(f==='fBank'){const name=v('bk_name').trim();if(!name)return;mutate(()=>U.core.banks.push({id:uid(),name,balance:num(v('bk_bal'))||0}),'Conta adicionada')}
  if(f==='fExp'){const val=num(v('ex_val'));if(!(val>0)){toast('Informe um valor maior que zero');return}mutate(()=>U.core.expenses.push({id:uid(),date:v('ex_date')||today(),desc:v('ex_desc').trim(),cat:v('ex_cat'),value:val}),'Gasto registrado')}
  if(f==='fNote'){const title=v('nt_title').trim();if(!title)return;const date=v('nt_date')||today(),text=v('nt_text');
    mutate(()=>{if(ui.editNote){Object.assign(U.core.notes.find(n=>n.id===ui.editNote),{title,date,text});ui.editNote=null}else U.core.notes.push({id:uid(),title,date,text})},'Nota salva')}
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('app').hidden)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ui.pal?closePal():openPal();return}
  if(!ui.pal){if(e.key==='Escape'&&ui.bell){ui.bell=false;renderNav()}return}
  if(e.key==='Escape'){closePal();return}
  const it=palItems();
  if(e.key==='ArrowDown'){e.preventDefault();ui.palSel=Math.min(it.length-1,ui.palSel+1);renderPal()}
  if(e.key==='ArrowUp'){e.preventDefault();ui.palSel=Math.max(0,ui.palSel-1);renderPal()}
  if(e.key==='Enter'){e.preventDefault();const x=it[ui.palSel];closePal();x&&x.run()}
});

/* tema */
function setTheme(th,silent){
  if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);
  if(!silent){U.core.settings.theme=th;persist();render()}
}

};
function authErr(e){const c=e&&e.code;if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;authMsg={t:'err',m:AUTH_ERR[c]||'Algo deu errado ('+(c||'erro')+'). Tente de novo.'};authBusy=false;renderAuthKeep()}
function renderAuth(mode){
  authMode=mode;const A=document.getElementById('auth');
  const t={login:['Entrar','Acesse sua operação.'],signup:['Criar conta','Grátis. Seus dados ficam só com você.'],reset:['Recuperar senha','Enviamos um link para você criar uma nova senha.']}[mode];
  A.innerHTML=`<div class="auth-wrap">
    <section class="auth-pitch">
      <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 6l4 8 2-4 4 8"/></svg></span><b>Arbitra</b></div>
      <h1 class="auth-h">Surebet com controle de verdade.</h1>
      <p class="muted" style="font-size:16px;max-width:46ch">Calcule stakes, registre cada aposta e saiba quais casas são clones antes que a limitação chegue em todas.</p>
      <ul class="auth-feats">
        <li>${ic('calc',18)}<span><b>Calculadora de 2 a 4 pernas</b> com freebet, comissão e perna fixa</span></li>
        <li>${ic('clones',18)}<span><b>Mapa de casas clones</b> com alerta de limitação em cadeia</span></li>
        <li>${ic('analises',18)}<span><b>Análises</b> por casa, dia da semana e tipo de aposta</span></li>
        <li>${ic('fin',18)}<span><b>Banca, gastos e metas</b> num só lugar, no celular e no computador</span></li>
      </ul>
      <div class="auth-sample" aria-hidden="true"><span class="lbl">Exemplo de cálculo</span><div class="row" style="justify-content:space-between"><span class="num">2,10 × 2,05</span><span class="num pos" style="font-weight:700">+3,73%</span></div><div class="pbar"><span style="width:96.4%"></span></div></div>
    </section>
    <section class="auth-card card">
      <h2 style="font-size:24px">${t[0]}</h2><p class="muted" style="margin-top:4px">${t[1]}</p>
      ${!fb?`<div class="alert ${FB_FAILED?'bad':''}" style="margin-top:14px">${ic('warn',16)}<div>${FB_FAILED?'Não foi possível carregar o Firebase (login e sincronização). Verifique a internet ou se alguma extensão, antivírus ou firewall está bloqueando <b>gstatic.com</b>. A demonstração funciona mesmo assim.':'O Firebase ainda não foi configurado. No <b>index.html</b>, preencha o bloco <b>CONFIGURAÇÃO DO FIREBASE</b>. Enquanto isso, dá para testar a demonstração.'}</div></div>`:''}
      ${authMsg?`<div class="alert ${authMsg.t==='err'?'bad':'good'}" style="margin-top:14px">${ic(authMsg.t==='err'?'warn':'check',16)}<div>${esc(authMsg.m)}</div></div>`:''}
      ${fb?`<form id="fAuth" style="display:flex;flex-direction:column;gap:12px;margin-top:18px">
        ${mode==='signup'?'<label class="f">Nome<input id="au_name" autocomplete="name" placeholder="Como quer ser chamado"></label>':''}
        <label class="f">E-mail<input id="au_email" type="email" autocomplete="email" required></label>
        ${mode!=='reset'?`<label class="f">Senha<input id="au_pass" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" minlength="6" required></label>`:''}
        ${mode==='login'?'<button type="button" class="linkish" data-auth="reset" style="align-self:flex-end;font-size:13px">Esqueci a senha</button>':''}
        ${mode==='signup'?'<p class="muted" style="font-size:12px">Ao criar a conta, você confirma ter 18 anos ou mais e concorda com os <a href="termos.html" target="_blank" rel="noopener">Termos de uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener">Política de privacidade</a>.</p>':''}
        <button class="btn pri" type="submit" ${authBusy?'disabled':''} style="justify-content:center;padding:11px">${authBusy?'Aguarde…':mode==='login'?'Entrar':mode==='signup'?'Criar conta':'Enviar link'}</button>
      </form>
      ${mode!=='reset'?`<div class="or"><span>ou</span></div><button class="btn" data-auth="google" style="width:100%;justify-content:center;padding:10px" ${authBusy?'disabled':''}><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4 6.8-10 6.8-17.2z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.8-6a24 24 0 0 0 0 21.4l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>Continuar com Google</button>`:''}

async function authSubmit(){
  const email=document.getElementById('au_email').value.trim(),pass=document.getElementById('au_pass')?.value||'';
  authBusy=true;authMsg=null;renderAuthKeep();
  try{
    if(authMode==='login')await signInWithEmailAndPassword(fb.auth,email,pass);
    else if(authMode==='signup'){const name=document.getElementById('au_name')?.value.trim();const cred=await createUserWithEmailAndPassword(fb.auth,email,pass);if(name)await updateProfile(cred.user,{displayName:name});written.core=null}
    else{await sendPasswordResetEmail(fb.auth,email);authBusy=false;authMsg={t:'ok',m:'Se existir uma conta com '+email+', o link de recuperação chega em alguns minutos. Confira o spam.'};renderAuth('login')}
  }catch(e){authErr(e)}
}
function renderAuthKeep(){const v=id=>document.getElementById(id)?.value;const keep={au_name:v('au_name'),au_email:v('au_email'),au_pass:v('au_pass')};renderAuth(authMode);Object.entries(keep).forEach(([k,x])=>{const el=document.getElementById(k);if(el&&x!=null)el.value=x})}
async function authGoogle(){
  authBusy=true;authMsg=null;renderAuth(authMode);
  const prov=new GoogleAuthProvider();
  try{await signInWithPopup(fb.auth,prov)}
  catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){try{await signInWithRedirect(fb.auth,prov)}catch(x){authErr(x)}}else authErr(e)}
}
document.getElementById('auth').addEventListener('click',e=>{
  const b=e.target.closest('[data-auth]');if(!b)return;const a=b.dataset.auth;
  if(a==='demo'){startDemo();return}
  if(a==='google'){authGoogle();return}
  authMsg=null;renderAuth(a);document.getElementById('au_email')?.focus();
});
document.getElementById('auth').addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();authSubmit()});

function boot(){
  if(!fb){showAuth('login');return}
  getRedirectResult(fb.auth).catch(authErr);
  onAuthStateChanged(fb.auth,u=>{
    authBusy=false;
    if(u){if(cloud.uid!==u.uid)startUser(u)}
    else{if(unsubCat){unsubCat();unsubCat=null}const wasDemo=cloud.demo;if(!wasDemo){cloud={uid:null,user:null,isAdmin:false,on:false,demo:false};showAuth(authMode)}}
  });
}

setTheme('auto',true);
boot();

window.__arbitraOk=true;


})();

  if(window.__arbitraOk)return;
  var d=document.createElement('div');
  d.style.cssText='max-width:560px;margin:12vh auto;padding:24px;font:15px/1.6 system-ui,sans-serif;color:#13201B;background:#fff;border:1px solid #D9E0DB;border-radius:12px';
  var errs=(window.__errs||[]).slice(0,4).map(function(x){return String(x).replace(/[<>&]/g,'')}).join('<br>');
  d.innerHTML='<h2 style="margin:0 0 8px">O Arbitra não conseguiu iniciar</h2><p style="margin:0 0 10px">Recarregue a página com <b>Ctrl+F5</b>. Se continuar, tire um print desta caixa e mande para o suporte.</p>'+(errs?'<p style="margin:0;font:12px/1.5 ui-monospace,Consolas,monospace;background:#F5F7F4;color:#13201B;padding:8px 10px;border-radius:8px;word-break:break-all">'+errs+'</p>':'');
  document.body.appendChild(d);
},4000)});
</script>

if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('arbitra')===0)caches.delete(k)})}).catch(function(){});
